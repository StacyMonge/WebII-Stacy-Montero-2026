<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/Formulario.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Remoto</title>
</head>
<body>
    <h1>Formulario</h1>
    <form name="formulario" enctype="application/x-www-form-urlencoded">
        <fieldset>
            <div class="">
                <label>Nombre completo:</label>
                <input type="text" id="nombre" maxlength="15" size="20" required autofocus>
            </div>
            <br>
            <div class="">
                <label>Correo electronico:</label>
                <input type="text" id="email" maxlength="30" size="35" required>
            </div>
            <br>
            <div class="">
                <label>Cédula:<label>
                    <input type="text" id="ced" maxlength="15" size="20" required>
            </div>
            <br>

            <div>
                <a href="#" id="btnGuardar">Enviar</a>
                <a href="#" id="btnborrar">Borrar</a>
            </div>
        </fieldset>
    </form>

    <div id="info"></div>


</body>
</html>
